<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ansh Gajbhiye</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a direct hit on a
      // client-routed path (e.g. /ansh_portfolio/about) 404s. This encodes
      // the path into a query string and redirects to index.html, which
      // decodes it back before React Router mounts. See spa-github-pages.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
